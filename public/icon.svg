<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Background with agricultural rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#fieldGrad)"/>
  
  <!-- Outer subtle field furrow lines -->
  <path d="M64 400 C 180 370, 332 370, 448 400" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M80 436 C 190 410, 322 410, 432 436" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- NexoCampo central monogram & agricultural leaf emblem -->
  <g transform="translate(256, 230)">
    <!-- Stylized 'N' node connection -->
    <path d="M -110 110 L -110 -70 L 40 80 L 40 -70" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Sprouting leaf representing agricultural evolution -->
    <path d="M 40 -70 C 40 -150, 130 -160, 140 -80 C 140 -20, 70 -30, 40 -70 Z" fill="url(#leafGrad)"/>
    <path d="M 40 -70 C 80 -100, 110 -100, 130 -85" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Offline sync indicator dot (glowing node) -->
    <circle cx="110" cy="110" r="26" fill="#facc15" stroke="#ffffff" stroke-width="8"/>
    <path d="M 102 110 L 108 116 L 120 104" stroke="#854d0e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- NexoCampo brand label -->
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">NEXOCAMPO</text>
</svg>
