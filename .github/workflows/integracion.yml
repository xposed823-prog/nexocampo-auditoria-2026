name: Auditoría de integración NexoCampo

on:
  push:
    branches:
      - integracion-pwa-auditoria-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integracion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Pruebas, tipos, dependencias y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci --legacy-peer-deps

      - name: Auditar vulnerabilidades de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Verificar TypeScript
        run: npm run lint

      - name: Compilar aplicación
        run: npm run build
