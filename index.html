<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="NexoCampo Auditoría 2026: supervisión de campo, registro de jornadas, labores, asistencia y reportes en una PWA móvil." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NexoCampo" />
    <meta name="application-name" content="NexoCampo Auditoría" />
    <meta name="msapplication-TileColor" content="#047857" />
    <title>NexoCampo Auditoría 2026</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="NexoCampo Auditoría 2026" />
    <meta property="og:description" content="Supervisión de campo, jornadas, labores, asistencia y reportes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexoCampo Auditoría 2026" />
    <meta name="twitter:description" content="Supervisión de campo y registro operativo en una PWA móvil." />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then((reg) => console.info('[NexoCampo] Service Worker listo:', reg.scope))
            .catch((err) => console.warn('[NexoCampo] No se pudo registrar el Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
